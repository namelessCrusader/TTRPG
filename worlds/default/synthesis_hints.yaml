    max_weight: 2.5
    max_bulk: 1.5
    max_attribute: 40
    stamina_cost: 20.0

  - hint_id: wood_shiv
    required_input_tags: [wooden]
    output_tags: [weapon, sharp, throwable]
    max_weight: 0.4
    max_bulk: 0.3
    max_attribute: 20
    stamina_cost: 8.0

  - hint_id: stone_weapon
