# synthesis_hints.yaml
#
# Lightweight crafting validity rules.  The engine uses these to validate
# whether a proposed crafted object (from the CRAFT kernel verb) is
# physically plausible given the actor's inventory.
#
# Fields:
#   hint_id              — unique string identifier
#   required_input_tags  — at least ONE item with ALL listed tags must be in inventory
#                          (OR semantics across items, AND semantics per item)
#   output_tags          — what the resulting object can reasonably be tagged as
#   max_weight           — maximum allowed weight of the output item (kg)
#   max_bulk             — maximum allowed bulk of the output item
#   max_attribute        — cap on any single numeric attribute value
#   stamina_cost         — stamina drained from the actor to perform the synthesis

hints:
  # ── Medical / survival ────────────────────────────────────────────────
  - hint_id: cloth_to_bandage
    required_input_tags: [cloth]
    output_tags: [bandage, consumable, healing]
    max_weight: 0.3
    max_bulk: 0.3
    max_attribute: 30
    stamina_cost: 5.0

  - hint_id: plant_cloth_salve
    required_input_tags: [plant]
    output_tags: [salve, consumable, healing, potion]
    max_weight: 0.5
    max_bulk: 0.5
    max_attribute: 40
    stamina_cost: 10.0

  # ── Weapons ────────────────────────────────────────────────────────────
  - hint_id: wood_to_club
    required_input_tags: [wooden]
    output_tags: [weapon, wooden, blunt]
    max_weight: 3.0
    max_bulk: 2.0
    max_attribute: 30
    stamina_cost: 15.0

  - hint_id: metal_weapon
    required_input_tags: [metal]
