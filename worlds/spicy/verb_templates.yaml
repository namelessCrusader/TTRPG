# Verb templates for The Silken Chamber.
#
# These define default simulation effects for intimate and social verbs.
# The compiler consults these BEFORE the generic freeform compiler, so they
# take precedence over the engine's built-in defaults for the listed verbs.
#
# NOTE: edge payload MUST use `edge_kind:` (not `kind:`) — the relational
# module reads `payload["edge_kind"]` when applying EDGE_CREATED/EDGE_UPDATED.
#
# Difficulty scale reference:
#   10-25  — almost always succeeds (Elara is welcoming; composure is low)
#   30-45  — modest check; only fails if the actor is very unskilled
#   50-65  — real contest; outcome uncertain
#   70+    — hard; reserved for things Elara isn't sure she wants

templates:
  # ── Light physical affection ────────────────────────────────────────────────

  - verb: caress
    contest:
      actor_attribute: persuasion
      target_attribute: composure
      difficulty: 20
    on_success:
      - kind: entity_emotional_state_changed
        payload:
          entity_id: "$target"
          to: happy
      - kind: edge_created
        payload:
          source: "$target"
          target: "$actor"
          edge_kind: intimate
          weight: 0.1
    on_failure:
      - kind: entity_emotional_state_changed
        payload:
          entity_id: "$target"
          to: neutral

