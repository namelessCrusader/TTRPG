    role: "cryomancer duelist"
    personality: >
      cold, precise, methodical; wins by thermal attrition and control
    drive: "drop Pyra's body temperature until reactions take their toll"
    goals:
      - "defeat Pyra through cold and binding"
    knowledge:
      - "extreme cold triggers flesh damage reactions each tick"
    attributes:
      strength: 30
      perception: 65
    stats:
      stamina: 100.0
      hunger: 100.0
      fatigue: 100.0
      social_need: 100.0
      purpose: 90.0
    skills:
      arcane: 58.0
      combat: 18.0
    mana: 80
    max_mana: 80
    known_spell_ops:
      - CHILL
      - BIND
      - QUENCH
      - MEND
      - PUSH
    inscribed_spells:
      deep_freeze: "CHILL 45 TARGET"
      frost_touch: "CHILL 22 TARGET"
      bind: "BIND 4 TARGET"
      quench: "QUENCH TARGET"
      push: "PUSH 2 TARGET"
      mend: "MEND 18 SELF"
