# MARK1 magic science: records (a truth-maintenance table for docs/magic-science.md)
# Created 2026-11-27 from the doc only. Schema from the Library survey
# surveys/2026-11-25-mark1-workflow-frameworks.md (S1, "the section 3b schema").
# Nothing here is a new decision. Where the doc does not say, the value is "unknown".
#
# CONVENTIONS
# - rests_on: written by hand from what the doc says each record uses.
# - label: the TRANSITIVE closure of rests_on (the base set it depends on), excluding the record itself.
#   Axioms with no rests_on have an empty label. If a record in a label is reopened, every record
#   that carries it in its label goes to needs-recheck (never deleted).
# - status: settled | provisional | needs-recheck | superseded | refuted | open.
#   "provisional" means a tentative decision; "open" means not decided yet (see below).
# - history: the key events of each record. The FULL record of case-level conflicts (pack moves,
#   domain clauses, surrenders) is the conflict log in docs/magic-science.md section 4b; a record's
#   history does not repeat every log entry.
# - entrenchment (1 = kept longest, 7 = given up first), the order in docs/magic-science.md "How we work":
#   1 axioms; 2 R0 targets; 3 lab results; 4 library-backed (library answers, and decisions whose main
#   support or correction came from the library); 5 owner choices among lawful options;
#   6 working hypotheses; 7 provisional case expectations (the case bank, not recorded here).
#   LEVELS WERE ASSIGNED FROM THE DOC TEXT, not by the owner: the owner may correct any of them.
# - discriminates: for each rejected option, a case it fails. The doc seldom lists the rejected options
#   of an early decision, so most say "unknown" or "owner preference"; "inferred" marks my reading.
# - needs-recheck means: decided before FQ1 (the root: an emergent medium, H2) and the medium may
#   change it. It does not mean the decision is wrong.
# - Open questions that are not decided yet are recorded too, with status "open" and entrenchment null
#   (a fixed sixth status, added 2026-11-27 after a check: "provisional" means a tentative DECISION).
#   Q5.5 is open and paused, so it keeps needs-recheck.
# - ENTRENCHMENT RANKS THE KIND OF RECORD, not the dependency. R0 (level 2) is a target list that the owner
#   fixed; its rests_on lists the decisions its lines were written under. A record never gets more
#   entrenched than what it rests on in practice: if a level-5 record under R0 is reopened, R0's affected
#   line goes to needs-recheck, and the reopening is logged with the level given up.
# - Level 4 versus 5: a decision whose numbers or mechanism came from a library answer or a lab check is 4;
#   a decision the owner chose among options that all passed the same checks is 5. Where a decision has both,
#   I took the lower number only when the doc says the library answer was decisive. Not set by the owner.
# - reconstructed: true marks a record with no entry of its own in the doc (an earlier answer, a claim
#   inside H1, or a library or lab source). It was split out for the truth-maintenance table only.
# - Case rows in the doc cite ids that have no record here (MC1-MC8, Q7, Q9, Q1.3). They are left as
#   written; see the derivation convention in section 4 of the doc.

meta:
  created: 2026-11-27
